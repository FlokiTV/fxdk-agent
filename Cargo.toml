[workspace]
members = ["apps/desktop/src-tauri", "crates/config", "crates/control-api", "crates/host"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FlokiTV/fxdk-agent"
rust-version = "1.99"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
utoipa = "5"

[workspace.lints.rust]
unsafe_code = "forbid"
