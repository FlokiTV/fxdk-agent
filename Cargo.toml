[workspace]
members = ["apps/desktop/src-tauri", "crates/config", "crates/control-api", "crates/dev-identity", "crates/fivem-client", "crates/fxserver", "crates/host", "crates/process-supervisor", "crates/runtime-web"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FlokiTV/fxdk-agent"
rust-version = "1.99"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
utoipa = "5"

[workspace.lints.rust]
unsafe_code = "forbid"
