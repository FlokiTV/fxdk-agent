<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FXDK Agent Runtime</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b12; }
      body { font-family: "Segoe UI", sans-serif; color: #fff; user-select: none; }
      #game { display: block; width: 100%; height: 100%; outline: 0; }
      #status {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 10;
        min-width: 280px;
        padding: 12px 14px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 8px;
        background: rgb(10 14 22 / 86%);
        pointer-events: none;
      }
      #status strong { display: block; font-size: 14px; }
      #status span { display: block; margin-top: 4px; color: #aeb8cc; font-size: 12px; }
      #status.active { border-color: rgb(34 197 94 / 55%); }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <section id="status">
      <strong id="status-title">Starting GameRuntime</strong>
      <span id="status-detail">Waiting for FxDK lifecycle…</span>
    </section>
    <script src="/game-view.js"></script>
  </body>
</html>
