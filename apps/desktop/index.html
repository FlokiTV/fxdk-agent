<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>FXDK Agent</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">WIP · MVP v0.1</p>
        <h1>FXDK Agent</h1>
        <p class="subtitle">Local control plane for FiveM/FxDK development.</p>
      </header>

      <section class="status-card" aria-labelledby="shell-status-title">
        <div>
          <p class="label" id="shell-status-title">Desktop shell</p>
          <p class="value" id="shell-status">Starting…</p>
        </div>
        <span class="status-dot" aria-hidden="true"></span>
      </section>

      <p class="hint">Control API and runtime lifecycle will be wired in the next MVP milestones.</p>
    </main>
  </body>
</html>
